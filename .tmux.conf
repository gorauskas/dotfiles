# PREFIX
unbind C-b
set -g prefix C-a          # Set Prefix Key Chord to C-a
bind-key C-a send-prefix   # pass through a ctrl-a if you press it twice

# BEHAVIOR
set -g mouse on
set -gq utf8 on             # Use UTF-8 encoding
set -gq status-utf8 on
set -g set-titles on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys emacs
set -g status-keys emacs
set -g visual-activity off
setw -g monitor-activity on
set -g history-limit 10000
setw -g automatic-rename on
setw -g aggressive-resize on
set -g set-titles-string "#S:#I #W"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g base-index 1         # start window index at 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# toggle sync panes
bind -n F12 setw synchronize-panes \; display-message "Sync Panes: #{?pane_synchronized,on,off}"

# Lengthen the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000

# SPLIT
# better split mnemonics
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# RELOAD
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# NAVIGATION
# Bind function keys.
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

######################
### DESIGN CHANGES ###
######################
theme_bg="#091310"
theme_fg="#E0F5EF"
theme_cyan="#65BFC4"
theme_black="#091310"
theme_gray="#40514C"
theme_magenta="#B89CE8"
theme_pink="#F06D75"
theme_red="#CE2029"
theme_green="#8BDFC4"
theme_yellow="#F5A500"
theme_blue="#80B9E8"
theme_orange="#FF7900"
theme_black4="#111111"
theme_black0="#000000"

# Status bar
set -g status "on"
set -gq status-utf8 on
set -g status-interval 3
set -g status-bg "${theme_black4}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-position bottom

# Messages
set -g message-style "fg=${theme_cyan},bg=${theme_black4},align=centre"
set -g message-command-style "fg=${theme_cyan},bg=${theme_black4},align=centre"

# Panes
set -g pane-border-style "fg=${theme_gray}"
set -g pane-active-border-style "fg=${theme_green}"

# Windows
set -g window-status-activity-style "fg=${theme_fg},bg=${theme_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${theme_fg},bg=${theme_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${theme_green},bg=${theme_black0}] #I:#[fg=${theme_green},bg=${theme_black0}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${theme_orange},bg=${theme_black0}]✔ "

# Statusline - other windows
set -g window-status-format "#[fg=${theme_green},bg=${theme_gray}] #I:#[fg=${theme_fg},bg=${theme_gray}]#W "

# Statusline - right side
# set -g status-right "#[fg=${theme_magenta},bg=${theme_black4},nobold,nounderscore,noitalics]#[fg=${theme_black4},bg=${theme_magenta},nobold,nounderscore,noitalics]󰖯 #[fg=${theme_fg},bg=${theme_black4}] #{window_name} #{?client_prefix,#[fg=${theme_blue}],#[fg=${theme_blue}]}#[bg=${theme_black4}]#{?client_prefix,#[bg=${theme_blue}],#[bg=${theme_blue}]}#[fg=${theme_black4}]󰆍 #[fg=${theme_fg},bg=${theme_black4}] #{session_name} "
set -g status-right "#[fg=${theme_cyan},bg=${theme_black4},nobold,nounderscore,noitalics]#[fg=${theme_black4},bg=${theme_cyan},nobold,nounderscore,noitalics]󰖯 #[fg=${theme_fg},bg=${theme_black4}] #{window_name} #[fg=${theme_magenta},bg=${theme_black4},nobold,nounderscore,noitalics]#[fg=${theme_black4},bg=${theme_magenta},nobold,nounderscore,noitalics]󰆍 #[fg=${theme_fg},bg=${theme_black4}] #{session_name} #[fg=${theme_green},bg=${theme_black4},nobold,nounderscore,noitalics]#[fg=${theme_black4},bg=${theme_green},nobold,nounderscore,noitalics] #[fg=${theme_fg},bg=${theme_black4}] %H:%M #[fg=${theme_yellow},bg=${theme_black4},nobold,nounderscore,noitalics]#[fg=${theme_black4},bg=${theme_yellow},nobold,nounderscore,noitalics] #[fg=${theme_fg},bg=${theme_black4}] #{?pane_synchronized,#[fg=${theme_green}],#[fg=${theme_red}]}#{?pane_synchronized,✔,✗} "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${theme_green}"
set -g mode-style "fg=${theme_green} bg=${theme_black4} bold"

#EOF
